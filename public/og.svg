<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#302a31"/>
      <stop offset=".55" stop-color="#24252b"/>
      <stop offset="1" stop-color="#202127"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(-507 300 -209 -353 1105 36)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#713f4d" stop-opacity=".45"/>
      <stop offset="1" stop-color="#713f4d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#111116" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(72 53)">
      <g transform="rotate(-7 26 26)">
        <rect width="52" height="52" rx="12" fill="#be3144"/>
