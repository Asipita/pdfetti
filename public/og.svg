    <path d="M73 162v287" stroke="#f0808b" stroke-opacity=".8" stroke-width="3"/>
    <text x="103" y="232" fill="#f7f5f6" font-size="68" font-weight="650" letter-spacing="-4.5">Your PDF,</text>
    <text x="103" y="310" fill="#f7f5f6" font-size="68" font-weight="650" letter-spacing="-4.5">finished<tspan fill="#f0808b">.</tspan></text>
    <text x="104" y="369" fill="#c6c1c9" font-size="21" font-weight="400">Annotate, extract, organize, and merge PDFs.</text>
    <text x="104" y="400" fill="#c6c1c9" font-size="21" font-weight="400">Free tools that run in your browser.</text>

    <g transform="translate(104 469)">
      <rect width="178" height="36" rx="18" fill="#fff" fill-opacity=".065" stroke="#fff" stroke-opacity=".12"/>
      <path d="m17 18 4 4 8-9" stroke="#f0808b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="23" fill="#e4dfe6" font-size="13" font-weight="600" letter-spacing=".5">NO ACCOUNT NEEDED</text>
      <rect x="190" width="224" height="36" rx="18" fill="#fff" fill-opacity=".065" stroke="#fff" stroke-opacity=".12"/>
      <path d="M207 14v-2a5 5 0 0 1 10 0v2m-12 0h14v11h-14z" stroke="#f0808b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="230" y="23" fill="#e4dfe6" font-size="13" font-weight="600" letter-spacing=".3">FILES STAY ON YOUR DEVICE</text>
    </g>

