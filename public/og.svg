        <rect width="226" height="150" rx="14" fill="#302f36" stroke="#fff" stroke-opacity=".13"/>
        <rect x="18" y="18" width="42" height="42" rx="11" fill="#50363f"/>
        <path d="M31 28h13a3 3 0 0 1 3 3v17H31a3 3 0 0 1-3-3V31a3 3 0 0 1 3-3Zm3 7h8m-8 5h5m-4 10 8-8 4 4-8 8-5 1z" stroke="#f0808b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="92" fill="#f5f2f5" font-size="19" font-weight="650" letter-spacing="-.5">Annotate</text>
        <text x="18" y="119" fill="#bdb8c1" font-size="13" font-weight="400">Fill forms, add text, and sign</text>
      </g>
      <g transform="translate(890 155)">
        <rect width="226" height="150" rx="14" fill="#302f36" stroke="#fff" stroke-opacity=".13"/>
        <rect x="18" y="18" width="42" height="42" rx="11" fill="#50363f"/>
        <path d="M28 28h11l5 5v17H28zM39 28v6h5m-3 5h5v13H33m-5-4h9" stroke="#f0808b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="m48 43 4 4 4-4m-4-7v11" stroke="#f0808b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="92" fill="#f5f2f5" font-size="19" font-weight="650" letter-spacing="-.5">Extract pages</text>
        <text x="18" y="119" fill="#bdb8c1" font-size="13" font-weight="400">Keep only the pages you need</text>
      </g>
      <g transform="translate(646 323)">
        <rect width="226" height="150" rx="14" fill="#302f36" stroke="#fff" stroke-opacity=".13"/>
        <rect x="18" y="18" width="42" height="42" rx="11" fill="#50363f"/>
        <path d="M29 30h3m-3 7h3m-3 7h3m-3 7h3m6-21h12v5H35zm0 7h12v5H35zm0 7h12v5H35z" stroke="#f0808b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="92" fill="#f5f2f5" font-size="19" font-weight="650" letter-spacing="-.5">Organize pages</text>
        <text x="18" y="119" fill="#bdb8c1" font-size="13" font-weight="400">Reorder, rotate, or remove</text>
      </g>
      <g transform="translate(890 323)">
        <rect width="226" height="150" rx="14" fill="#302f36" stroke="#fff" stroke-opacity=".13"/>
        <rect x="18" y="18" width="42" height="42" rx="11" fill="#50363f"/>
        <path d="M28 30h11l4 4v16H28zm12 0v5h4m2 4h8v12h-8zm4-3v-6h8v9" stroke="#f0808b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M48 43h8m-4-4v8" stroke="#f0808b" stroke-width="1.8" stroke-linecap="round"/>
        <text x="18" y="92" fill="#f5f2f5" font-size="19" font-weight="650" letter-spacing="-.5">Merge PDFs</text>
