        <path d="M39 13v8h-8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="68" y="38" fill="#f7f4f6" font-size="32" font-weight="700" letter-spacing="-1.4">PDFetti</text>
    </g>
    <g transform="translate(843 70)">
